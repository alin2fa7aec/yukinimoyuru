# nordfox (nightfox.nvim) colors, matching the waybar and wezterm themes.
# Colors are written as RRGGBBAA
[main]
# Moralerspace lacks the icons, so fall back to Symbols Nerd Font (used by the power menu)
font=Moralerspace Argon HW:size=13,Symbols Nerd Font:size=13
icon-theme=breeze-dark
terminal=wezterm start --
prompt="❯ "
width=40
lines=12
horizontal-pad=24
vertical-pad=16
inner-pad=8
match-counter=yes

[colors]
# The background is the same bg1 as the waybar boxes, slightly translucent
background=2e3440f0
text=cdcecfff
message=abb1bbff
prompt=88c0d0ff
placeholder=7e8188ff
input=cdcecfff
match=88c0d0ff
selection=3e4a5bff
selection-text=cdcecfff
selection-match=88c0d0ff
counter=7e8188ff
border=81a1c1ff

# A thin border with square corners, matching the waybar boxes
[border]
width=1
radius=0
